# breadcast: add these to your hyprland.conf
#
# This is classic hyprlang (.conf) syntax, for stock Hyprland installs. On
# BOS specifically, hyprland.conf is deprecated in favor of a Lua config
# (hyprland.lua) driven by JSON files (binds.json, etc.); see
# contrib/binds.json for the equivalent BOS-native keybind snippet instead
# of this file. There is currently no BOS-native equivalent for the
# layerrule lines below (no layer-rule JSON schema exists yet); on BOS the
# popup will work without the frosted-glass blur until that's added.
#
# Blur: blurs what's behind the transparent window, giving the frosted-glass look.
# ignorezero: skips blurring fully-transparent pixels (outside the panel) for
# a cleaner result.
layerrule = blur, breadcast
layerrule = ignorezero, breadcast

# Keybind: Super+C opens the device picker popup.
bind = $mainMod, C, exec, breadcast
